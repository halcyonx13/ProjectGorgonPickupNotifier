[package]
name = "pg-pickup-notifier"
version = "1.1.0"
edition = "2024"
description = "Shows a small popup with the name and icon of every item you pick up in Project Gorgon."
build = "build.rs"

[[bin]]
name = "pg-pickup-notifier"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tiny-skia = "0.12"
fontdue = "0.9"
fontdb = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3.4", features = ["platform-verifier"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
